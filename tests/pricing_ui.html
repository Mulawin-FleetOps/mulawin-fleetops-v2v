<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pricing UI fixture</title>
<link rel="stylesheet" href="../public/assets/vendor/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="../public/assets/css/app.css">
<div id="fixture"></div><div id="tools"></div><div id="toastZone"></div><pre id="results">RUNNING</pre>
<script src="../public/assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script><script src="../public/assets/js/core.js"></script><script src="../public/assets/js/modules/operations/routes.js"></script><script src="../public/assets/js/modules/administration/admin.js"></script><script src="../public/assets/js/modules/accounting/billing.js"></script>
<script>
(async()=>{
const checks=[],calls=[],assert=(v,s)=>{if(!v)throw Error(s);checks.push('PASS '+s);},pause=async()=>{await new Promise(r=>setTimeout(r,400));for(let i=0;i<40&&[...document.querySelectorAll('.modal')].some(m=>bootstrap.Modal.getInstance(m)?._isTransitioning);i++)await new Promise(r=>setTimeout(r,50));};
App.me={user:{id:1,role:'admin'},truckTypes:['Container','Wing Van','Car Carrier'],nav:[]};App.route=()=>{};App.current={page:'routes',query:{}};UI.askWithinModal=async()=>true;
const quote={delivery_km:'100',garage_km:'20',diesel_value:{value:'60'},efficiency_value:{value:'4'},liters:30,fuel:'1800.00',estimate_total:'2800.00',missing:[]};
App.api=async(action,data)=>{calls.push({action,data});if(action==='Routes.pricing_estimate')return quote;if(action==='Billing.pricing_report')return {rows:[{billing_id:1,status:'Paid',existing:'1000',proposed:null,missing:['Historical snapshot unavailable'],can_apply:false,correction:'Review only'}],next_after_id:null};return {message:'Fixture saved'};};
try{
 await RouteUI.rate({id:1,status:'Pending Rate',route_ref:'R-TEST',client:'Fixture Client',origin_label:'Pickup',destination_label:'Delivery',truck_type:'Container',distance_km:100},{});await pause();
 let form=document.querySelector('.modal form');assert(form&&form.querySelector('[name=rate_amount]'),'Existing fixed-rate modal reused');
 assert([...form.querySelectorAll('input,select,textarea')].every(x=>['rate_amount','notes'].includes(x.name)),'Fuel, efficiency, kilometers and total have no editable controls');
 assert(form.textContent.includes('Current fuel charge')&&form.textContent.includes('Estimated liters'),'Fuel breakdown is read-only');form.elements.rate_amount.value='1000';form.elements.rate_amount.dispatchEvent(new Event('change'));await pause();assert(form.querySelector('[data-pricing-total]').textContent.includes('2,800'),'Estimated total comes from backend response');
 form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();const sent=calls.find(x=>x.action==='Routes.rate_enter');assert(sent.data.rate_amount==='1000'&&!('fuel' in sent.data)&&!('diesel' in sent.data),'Rate submission stores only fixed contractual amount');
 UI.closeDrawer();await pause();const ctx={el:document.querySelector('#fixture'),tools:document.querySelector('#tools'),data:{history:[],current:{},truckTypes:App.me.truckTypes},reload:async()=>{App.pages['fuel-adjustment'].render(ctx);}};
 const previousApi=App.api;App.api=async(action,data)=>{if(action!=='Admin.pricing_save')return previousApi(action,data);calls.push({action,data});const row={setting_key:data.setting_key,effective_date:data.effective_date||UI.today(),effective_at:data.setting_key==='diesel'?null:UI.today()+' 12:00:00',value_json:JSON.stringify({value:data.value}),reference:data.reference};ctx.data.history.unshift(row);ctx.data.current[data.setting_key]=row;return {message:'Fixture persisted'};};
 const render=()=>App.pages['fuel-adjustment'].render(ctx),modal=()=>[...document.querySelectorAll('.modal')].find(m=>bootstrap.Modal.getInstance(m)?._isShown),submit=async()=>{modal().querySelector('form').dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));await pause();};
 render();assert(ctx.el.textContent.includes('Weekly Diesel Price')&&ctx.el.textContent.includes('Current effective date'),'Diesel card shows current price and effective date');assert(!ctx.el.textContent.includes('Garage')&&!ctx.tools.textContent.includes('Add Effective'),'No garage or generic settings controls on the page');assert(ctx.el.querySelector('details')&&!ctx.el.querySelector('details').open,'Configuration History is collapsible and initially closed');
 ctx.el.querySelector('[data-edit-diesel]').click();await pause();let edit=modal();form=edit.querySelector('form');assert(form.elements.effective_date&&!form.elements.setting_key,'Edit Price retains date without generic Setting dropdown');assert(form.elements.historical_verified.disabled,'Historical verification hidden for current diesel date');form.elements.effective_date.value='2020-01-01';form.elements.effective_date.dispatchEvent(new Event('change'));assert(!form.elements.historical_verified.disabled&&form.elements.historical_verified.required,'Past diesel dates require historical source verification');form.elements.effective_date.value=UI.today();form.elements.effective_date.dispatchEvent(new Event('change'));form.elements.value.value='65';form.elements.reference.value='Fixture diesel update';let before=calls.filter(c=>c.action==='Admin.pricing_save').length;edit.querySelector('[data-fuel-review-button]').click();assert(!edit.querySelector('[type=submit]').hidden&&calls.filter(c=>c.action==='Admin.pricing_save').length===before,'Review Update displays confirmation without saving');assert(edit.querySelector('[type=submit]').textContent==='Confirm Update'&&edit.querySelector('[data-fuel-review]').textContent.includes('65'),'Confirmation shows exact diesel update');await submit();assert(!modal(),'Confirmed diesel modal closes');assert(ctx.el.textContent.includes('65.00')&&ctx.data.history.length===1,'Confirmed diesel update persists and refreshes current price/history');
 for(const type of ['Car Carrier','Container','Wing Van']){
  const row=[...ctx.el.querySelectorAll('tbody tr')].find(r=>r.textContent.includes(type));assert(!!row?.querySelector('[data-act=edit]'),'Visible Edit button for '+type);row.querySelector('[data-act=edit]').click();await pause();edit=modal();form=edit.querySelector('form');assert(!!form.elements.truck_type,'Truck modal opened: '+JSON.stringify([...document.querySelectorAll('.modal')].map(m=>({title:m.querySelector('.modal-title').textContent,shown:bootstrap.Modal.getInstance(m)?._isShown}))));assert(form.elements.truck_type.readOnly&&form.elements.truck_type.value===type&&!form.elements.effective_date,'Truck modal is read-only type with no Effective Date: '+type);form.elements.value.value='4.25';form.elements.reference.value='Fixture efficiency '+type;edit.querySelector('[data-fuel-review-button]').click();assert(edit.querySelector('[data-fuel-review]').textContent.includes('Asia/Manila'),'Efficiency review explains immediate Manila effect');await submit();assert(!modal(),'Confirmed efficiency modal closes: '+type);const saved=calls.filter(c=>c.action==='Admin.pricing_save').at(-1);assert(saved.data.setting_key===type&&!('effective_date' in saved.data),'Efficiency payload omits client effective date: '+type);
 }
 assert(ctx.data.history.length===4&&ctx.el.textContent.includes('4.25'),'Efficiency saves refresh values and append visible history');ctx.el.querySelector('details').open=true;assert(ctx.el.querySelector('details').open,'History expands');
 await BillUI.pricingReport();assert(document.querySelector('.app-drawer').textContent.includes('Unreconciled'),'Missing historical inputs display as unreconciled');assert(!document.querySelector('.app-drawer [data-act=apply]'),'Paid records expose no apply correction action');
 document.querySelector('#results').textContent=checks.join('\n')+'\nRESULT: '+checks.length+' passed, 0 failed';
}catch(e){document.querySelector('#results').textContent=checks.join('\n')+'\nRESULT: '+checks.length+' passed, 1 failed\n'+e.stack;}
})();
</script></html>
