<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mulawin FleetOps — Purchasing Interactive Wireframe</title>
<style>
:root{font:14px Inter,system-ui,Arial,sans-serif;color:#20382b;background:#f4f7f5}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:flex;min-height:100vh}.side{width:246px;flex:none;background:#163e2a;color:#d7e7db;padding:26px 15px}.brand{font-size:18px;letter-spacing:1.5px;font-weight:850;margin:3px 10px 29px}.brand small{display:block;font-size:10px;letter-spacing:2px;opacity:.7}.nav-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#98bcaa;padding:0 12px;margin:0 0 12px}.nav{display:flex;width:100%;text-align:left;align-items:center;gap:11px;color:#dceae2;background:transparent;border:0;border-radius:9px;padding:13px;margin:4px 0}.nav:hover,.nav.on{background:#2b6947;color:white}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #dde9e1;display:flex;justify-content:space-between;align-items:center;padding:15px 28px}.top b{color:#184e32}.top small{color:#789080}.wrap{padding:27px;max-width:1530px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:21px;flex-wrap:wrap}h1{margin:0 0 5px;font-size:25px;font-weight:780}.desc{margin:0;color:#7d9080}.btn{border:1px solid #d6e5da;background:white;color:#24643e;border-radius:9px;padding:9px 14px;font-weight:650}.btn:hover{background:#edf7ef}.btn.primary{background:#227c49;color:white;border-color:#227c49}.btn.warn{color:#b54c48;border-color:#eac3c1}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stats{background:white;border:1px solid #e0eae2;border-radius:12px;padding:18px;text-align:left;min-height:104px;box-shadow:0 1px 4px #123b2310}.stats small{display:block;color:#7a8e7d;font-weight:650}.stats strong{display:block;font-size:28px;margin:10px 0;color:#1c5235}.stats span{font-size:12px;color:#768f7c}.two{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:18px}.panel{background:white;border:1px solid #e1eae4;border-radius:12px;overflow:hidden;margin:17px 0;box-shadow:0 1px 4px #123b2310}.panel h2{margin:0;font-size:15px;color:#244c34;padding:16px 19px;border-bottom:1px solid #e9f0ea}.panel .inside{padding:14px 18px}.item{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid #edf2ee;padding:12px 0}.item:last-child{border:0}.item b{display:block;font-size:13px}.item small{display:block;color:#829286;margin-top:4px}.badge{border-radius:20px;padding:5px 9px;display:inline-block;font-size:11px;font-weight:750;background:#edf5ed;color:#34784a}.badge.amber{background:#fff5df;color:#9c711b}.badge.red{background:#ffece9;color:#ad504d}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:19px 0}.tab{border:1px solid #dce8df;padding:10px 14px;border-radius:8px;background:#fff;color:#648070}.tab.active{background:#e6f4ea;border-color:#a5ccb0;color:#267849;font-weight:750}.toolbar{display:flex;justify-content:space-between;gap:8px;padding:15px;border-bottom:1px solid #e9efeb}.search{border:1px solid #d4e2d7;border-radius:8px;padding:10px 12px;width:min(360px,100%)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th{text-align:left;background:#f7faf8;color:#647a6d;font-size:12px;padding:14px 15px}td{padding:14px 15px;border-bottom:1px solid #ecf1ed;font-size:13px}tr:hover td{background:#fbfdfb}.muted{color:#7b8b7d;font-size:12px}.controls{display:flex;gap:7px}.mini{padding:6px 8px;border:1px solid #d8e6dc;border-radius:7px;background:white;color:#286f43}.notice{padding:12px 14px;background:#eff8f2;color:#49775a;border-radius:9px;margin:0 0 15px}.cover{position:fixed;inset:0;background:#10271e88;display:none;place-items:center;padding:15px;z-index:10}.cover.show{display:grid}.dialog{width:min(720px,100%);max-height:94vh;overflow:auto;background:#f9fcfa;border-radius:17px;box-shadow:0 15px 70px #0c321e55}.dialog header{padding:20px 24px;background:linear-gradient(110deg,#eef8f0,#fff);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e1eae3}.dialog h2{margin:0;color:#195635;font-size:19px}.dialog .body{padding:22px 25px}.dialog footer{background:white;padding:13px 25px;display:flex;justify-content:flex-end;gap:9px;border-top:1px solid #e0e8e1}.fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-weight:700;color:#356449;font-size:12px}.field input,.field select,.field textarea{border:1px solid #d4e3d8;border-radius:9px;padding:11px 12px;background:white;min-width:0}.field textarea{min-height:85px}.footnote{color:#8a998d;font-size:12px;margin:14px 0}.pill{padding:6px 10px;background:#e9f5ed;color:#236a3d;border-radius:25px;font-size:11px;font-weight:700}@media(max-width:1160px){.grid4{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:750px){.app{display:block}.side{width:100%;padding:12px;display:flex;align-items:center;overflow:auto}.brand{margin:0 16px 0 0;font-size:13px}.brand small,.nav-label{display:none}.nav{white-space:nowrap;width:auto;font-size:12px;padding:10px}.wrap{padding:17px}.grid4{grid-template-columns:1fr 1fr}.top{padding:12px 17px}.fields{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">MULAWIN<small>FLEET OPERATIONS</small></div><div class="nav-label">Purchasing workspace</div><div id="nav"></div></aside><main class="main"><div class="top"><b>FleetOps / Purchasing</b><small><span class="pill">Interactive prototype</span> &nbsp; Purchasing Officer</small></div><div class="wrap" id="content"></div></main></div><div class="cover" id="cover"><div class="dialog"><header><h2 id="modalTitle"></h2><button class="btn" onclick="closeModal()">✕</button></header><div class="body" id="modalBody"></div><footer id="modalFooter"></footer></div></div>
<script>
'use strict';
const nav=[['dashboard','▦','Dashboard'],['requests','☷','Parts Requests'],['orders','▤','Purchase Orders'],['inventory','▣','Inventory'],['movements','⇄','Stock Movements'],['reports','▥','Reports']];
const data={page:'dashboard',tab:'All',search:'',sequence:5,requests:[{id:1,ref:'PR-0001',truck:'TST-MP-001',part:'Brake hose assembly',qty:4,released:0,status:'Requested',repair:'MR-0001'},{id:2,ref:'PR-0002',truck:'TST-MP-002',part:'Radiator hose',qty:3,released:1,status:'Partially Released',repair:'MR-0002'},{id:3,ref:'PR-0003',truck:'TST-MP-001',part:'Air filter element',qty:6,released:0,status:'Not Available',repair:'MR-0003'},{id:4,ref:'PR-0004',truck:'TST-MP-002',part:'Electrical fuse set',qty:2,released:2,status:'Released',repair:'MR-0004'}],parts:[{id:1,code:'BRK-HOSE-01',name:'Brake hose assembly',qty:2,min:5,price:950},{id:2,code:'ENG-HOSE-02',name:'Radiator hose',qty:5,min:4,price:1250},{id:3,code:'FLT-003',name:'Air filter element',qty:0,min:7,price:480},{id:4,code:'ELC-FUSE-04',name:'Electrical fuse set',qty:11,min:6,price:175}],orders:[{id:1,ref:'PO-0001',supplier:'North Parts Trading',part:'Brake hose assembly',qty:8,received:0,total:7600,status:'Pending Approval',approval:'Finance'},{id:2,ref:'PO-0002',supplier:'Highway Industrial Supplies',part:'Air filter element',qty:12,received:0,total:5760,status:'Approved',approval:'Finance'},{id:3,ref:'PO-0003',supplier:'Metro Auto Components',part:'Radiator hose',qty:8,received:3,total:10000,status:'Partially Received',approval:'Finance'}],movements:[{part:'Electrical fuse set',type:'Stock Out',qty:-2,ref:'PR-0004'},{part:'Radiator hose',type:'Stock In',qty:3,ref:'PO-0003'}]};
const money=n=>'₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function badge(s){const cl=/Not Available|Rejected|Out/.test(s)?' red':/Requested|Pending|Partially|Low|Approved/.test(s)?' amber':'';return '<span class="badge'+cl+'">'+esc(s)+'</span>'}
function move(page,tab='All'){data.page=page;data.tab=tab;data.search='';render();window.scrollTo(0,0)}
function head(name,detail,button=''){return '<div class="heading"><div><h1>'+name+'</h1><p class="desc">'+detail+'</p></div>'+button+'</div>'}
function stats(a){return '<div class="grid4">'+a.map(x=>'<button class="stats" onclick="move(\''+x[3]+'\',\''+(x[4]||'All')+'\')"><small>'+x[0]+'</small><strong>'+x[1]+'</strong><span>'+x[2]+'</span></button>').join('')+'</div>'}
function panel(name,inner){return '<section class="panel"><h2>'+name+'</h2><div class="inside">'+inner+'</div></section>'}
function item(title,info,status,page){return '<div class="item"><div><b>'+esc(title)+'</b><small>'+esc(info)+'</small></div><div>'+badge(status)+' <button class="mini" onclick="move(\''+page+'\')">Open</button></div></div>'}
function tabs(xs){return '<div class="tabs">'+xs.map(x=>'<button class="tab '+(data.tab===x?'active':'')+'" onclick="data.tab=\''+x+'\';render()">'+x+'</button>').join('')+'</div>'}
function search(){return '<div class="toolbar"><input class="search" placeholder="Search records…" value="'+esc(data.search)+'" oninput="data.search=this.value;drawRows()"></div><div class="tablewrap" id="rows"></div>'}
function table(headers,rows){return '<table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table>'}
function tr(cols){return '<tr>'+cols.map(c=>'<td>'+c+'</td>').join('')+'</tr>'}
function filtered(rows){const q=data.search.toLowerCase();return rows.filter(x=>JSON.stringify(x).toLowerCase().includes(q))}
function dashboard(){const low=data.parts.filter(p=>p.qty<=p.min).length;return head('Purchasing Dashboard','Requests, purchase orders, deliveries and stock readiness.')+stats([['Pending Requests',data.requests.filter(x=>x.status==='Requested').length,'Waiting for stock check','requests','Requested'],['For Follow-up',data.requests.filter(x=>['Not Available','Partially Released'].includes(x.status)).length,'Shortage / partially released','requests','Follow-up'],['Pending PO Approval',data.orders.filter(x=>x.status==='Pending Approval').length,'Finance / Admin decision','orders','Pending Approval'],['Low Stock Items',low,'Reorder attention','inventory','Low Stock']])+'<div class="two">'+panel('Parts Requests Requiring Action',data.requests.filter(x=>x.status!=='Released').map(x=>item(x.ref,x.truck+' · '+x.part,x.status,'requests')).join(''))+panel('Purchase Order Follow-up',data.orders.filter(x=>x.status!=='Received').map(x=>item(x.ref,x.supplier,x.status,'orders')).join(''))+'</div><div class="two">'+panel('Low Stock Alerts',data.parts.filter(x=>x.qty<=x.min).map(x=>item(x.code,x.qty+' on hand · reorder '+x.min,'Low Stock','inventory')).join(''))+panel('Quick Access',[['Process requests','requests'],['Create purchase order','orders'],['View inventory','inventory'],['Stock movements','movements']].map(x=>'<div class="item"><b>'+x[0]+'</b><button class="btn" onclick="move(\''+x[1]+'\')">Open</button></div>').join(''))+'</div>'}
function requests(){return head('Parts Requests','From Motorpool — stock check, releases and shortages.')+stats([['All Requests',data.requests.length,'Recorded requests','requests'],['Requested',data.requests.filter(x=>x.status==='Requested').length,'Awaiting check','requests','Requested'],['Follow-up',data.requests.filter(x=>['Not Available','Partially Released'].includes(x.status)).length,'Need replenishment','requests','Follow-up'],['Released',data.requests.filter(x=>x.status==='Released').length,'Fulfilled','requests','Released']])+tabs(['All','Requested','Follow-up','Released'])+'<section class="panel">'+search()+'</section>'}
function orders(){return head('Purchase Orders','Create orders, track approvals and record incoming goods.','<button class="btn primary" onclick="poForm()">＋ New purchase order</button>')+stats([['Purchase Orders',data.orders.length,'All orders','orders'],['Awaiting Approval',data.orders.filter(x=>x.status==='Pending Approval').length,'Finance / Admin','orders','Pending Approval'],['To Receive',data.orders.filter(x=>['Approved','Partially Received'].includes(x.status)).length,'Expected deliveries','orders','To Receive'],['Received',data.orders.filter(x=>x.status==='Received').length,'Complete deliveries','orders','Received']])+tabs(['All','Pending Approval','To Receive','Received'])+'<section class="panel">'+search()+'</section><p class="footnote">Approval belongs to Finance or Admin. Purchasing creates the PO and records approved deliveries.</p>'}
function inventory(){return head('Inventory','Parts masterlist and reorder alerts.','<button class="btn primary" onclick="partForm()">＋ Add part</button>')+stats([['Active Parts',data.parts.length,'Catalog items','inventory'],['Low Stock',data.parts.filter(x=>x.qty<=x.min).length,'Reorder required','inventory','Low Stock'],['Stock Units',data.parts.reduce((a,x)=>a+x.qty,0),'Units on hand','inventory'],['Inventory Value',money(data.parts.reduce((a,x)=>a+x.qty*x.price,0)),'Cost basis','inventory']])+tabs(['All','Low Stock','In Stock'])+'<section class="panel">'+search()+'</section>'}
function movements(){return head('Stock Movements','Trace parts released and received.')+tabs(['All','Stock In','Stock Out'])+'<section class="panel">'+search()+'</section>'}
function reports(){const reqStatuses=[...new Set(data.requests.map(x=>x.status))],poStatuses=[...new Set(data.orders.map(x=>x.status))];return head('Purchasing Reports','Illustrative read-only summary from demo records.','<button class="btn" onclick="window.print()">Print preview</button>')+stats([['Total Requests',data.requests.length,'All request states','requests'],['PO Total',money(data.orders.reduce((a,x)=>a+x.total,0)),'Demo amount','orders'],['Stock Movements',data.movements.length,'In and out','movements'],['Stock Alerts',data.parts.filter(x=>x.qty<=x.min).length,'Low and out of stock','inventory']])+'<div class="two">'+panel('Requests by Status',reqStatuses.map(s=>item(s,data.requests.filter(x=>x.status===s).length+' request(s)',s,'requests')).join(''))+panel('Purchase Order Status',poStatuses.map(s=>item(s,data.orders.filter(x=>x.status===s).length+' order(s)',s,'orders')).join(''))+'</div><p class="footnote">Preview only; real Purchasing Reports must use approved server-side financial metrics.</p>'}
function drawRows(){const root=document.getElementById('rows');if(!root)return;const p=data.page;let arr=[];
if(p==='requests')arr=filtered(data.requests.filter(x=>data.tab==='All'||x.status===data.tab||(data.tab==='Follow-up'&&['Not Available','Partially Released'].includes(x.status)))).map(x=>tr([x.ref,x.truck,x.repair,x.part,x.qty+' / '+x.released,badge(x.status),'<button class="btn" onclick="requestModal('+x.id+')">View / Process</button>'])); 
if(p==='orders')arr=filtered(data.orders.filter(x=>data.tab==='All'||x.status===data.tab||(data.tab==='To Receive'&&['Approved','Partially Received'].includes(x.status)))).map(x=>tr([x.ref,esc(x.supplier),esc(x.part),money(x.total),badge(x.status),esc(x.approval),'<button class="btn" onclick="orderModal('+x.id+')">Open</button>']));
if(p==='inventory')arr=filtered(data.parts.filter(x=>data.tab==='All'||(data.tab==='Low Stock'?x.qty<=x.min:x.qty>x.min))).map(x=>tr([esc(x.code),esc(x.name),String(x.qty),String(x.min),money(x.price),badge(x.qty<=x.min?'Low Stock':'Available'),'<button class="btn" onclick="partForm('+x.id+')">Edit</button>']));
if(p==='movements')arr=filtered(data.movements.filter(x=>data.tab==='All'||x.type===data.tab)).map(x=>tr([esc(x.part),esc(x.type),String(x.qty),esc(x.ref)]));
root.innerHTML=table(p==='requests'?['Reference','Truck','Repair','Part','Qty / Released','Status','Action']:p==='orders'?['Order','Supplier','Part','Total','Status','Approver','Action']:p==='inventory'?['Part no.','Description','On hand','Reorder level','Cost','Availability','Action']:['Part','Movement','Quantity','Reference'],arr);}
function render(){document.getElementById('nav').innerHTML=nav.map(([id,ic,name])=>'<button class="nav '+(id===data.page?'on':'')+'" onclick="move(\''+id+'\')">'+ic+' &nbsp; '+name+'</button>').join('');document.getElementById('content').innerHTML=({dashboard,requests,orders,inventory,movements,reports}[data.page])();drawRows();}
function modal(title,body,footer){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalFooter').innerHTML='<button class="btn" onclick="closeModal()">Cancel</button>'+footer;document.getElementById('cover').classList.add('show')}
function closeModal(){document.getElementById('cover').classList.remove('show')}
function field(name,label,value='',type='text'){return '<div class="field"><label for="'+name+'">'+label+'</label><input id="'+name+'" type="'+type+'" value="'+esc(value)+'"></div>'}
function requestModal(id){const r=data.requests.find(x=>x.id===id),part=data.parts.find(x=>x.name===r.part),left=r.qty-r.released;modal('Parts Request · '+r.ref,'<div class="notice">Motorpool request for '+esc(r.truck)+' — '+esc(r.repair)+'. Purchasing releases stock; inventory is adjusted automatically in the live system.</div><div class="fields">'+field('qty','Quantity to release (remaining '+left+')',Math.min(left,part?.qty||0),'number')+'</div>',left?'<button class="btn warn" onclick="markUnavailable('+id+')">Mark unavailable</button><button class="btn primary" onclick="release('+id+')">Release stock</button>':'<button class="btn primary" onclick="closeModal()">Close</button>')}
function release(id){const r=data.requests.find(x=>x.id===id),part=data.parts.find(x=>x.name===r.part),q=+document.getElementById('qty').value;if(!Number.isInteger(q)||q<=0||q>r.qty-r.released||q>part.qty)return alert('Enter a valid quantity within stock and remaining request.');part.qty-=q;r.released+=q;r.status=r.released===r.qty?'Released':'Partially Released';data.movements.unshift({part:r.part,type:'Stock Out',qty:-q,ref:r.ref});closeModal();render()}
function markUnavailable(id){const r=data.requests.find(x=>x.id===id);r.status=r.released?'Partially Released':'Not Available';closeModal();render()}
function poForm(){modal('New purchase order','<div class="notice">Purchasing prepares the PO. Finance or Admin approves based on the configured threshold.</div><div class="fields">'+field('supplier','Supplier')+field('purpose','Purpose')+field('poPart','Part description')+field('poQty','Quantity',1,'number')+field('poPrice','Unit price (₱)',0,'number')+'</div>','<button class="btn primary" onclick="savePO()">Submit for approval</button>')}
function savePO(){const supplier=document.getElementById('supplier').value.trim(),purpose=document.getElementById('purpose').value.trim(),part=document.getElementById('poPart').value.trim(),qty=+document.getElementById('poQty').value,price=+document.getElementById('poPrice').value;if(!supplier||!purpose||!part||!Number.isInteger(qty)||qty<=0||price<0)return alert('Complete supplier, purpose and valid item details.');const id=++data.sequence;data.orders.unshift({id,ref:'PO-'+String(id).padStart(4,'0'),supplier,part,qty,received:0,total:qty*price,status:'Pending Approval',approval:'Finance / Admin'});closeModal();render()}
function orderModal(id){const o=data.orders.find(x=>x.id===id),remaining=o.qty-o.received;modal('Purchase Order · '+o.ref,'<div class="notice">'+esc(o.supplier)+' · '+esc(o.status)+' · '+esc(o.approval)+'</div><p>Ordered: '+o.qty+' · Received: '+o.received+'</p>'+(o.status==='Pending Approval'?'<p class="muted">Approval is performed by Finance/Admin, not Purchasing.</p>':'')+(['Approved','Partially Received'].includes(o.status)?'<div class="fields">'+field('recv','Quantity received now (maximum '+remaining+')',remaining,'number')+'</div>':''),['Approved','Partially Received'].includes(o.status)?'<button class="btn primary" onclick="receive('+id+')">Record receiving</button>':'<button class="btn" onclick="closeModal()">Close</button>')}
function receive(id){const o=data.orders.find(x=>x.id===id),q=+document.getElementById('recv').value;if(!Number.isInteger(q)||q<=0||q>o.qty-o.received)return alert('Enter actual received quantity.');o.received+=q;o.status=o.received===o.qty?'Received':'Partially Received';const part=data.parts.find(p=>p.name===o.part);if(part)part.qty+=q;data.movements.unshift({part:o.part,type:'Stock In',qty:q,ref:o.ref});closeModal();render()}
function partForm(id){const p=data.parts.find(x=>x.id===id);modal(p?'Edit inventory part':'Add inventory part','<div class="fields">'+field('partCode','Part number',p?.code||'')+field('partName','Description',p?.name||'')+field('partQty','On hand',p?.qty||0,'number')+field('partMin','Reorder level',p?.min||0,'number')+field('partPrice','Unit cost',p?.price||0,'number')+'</div>','<button class="btn primary" onclick="savePart('+Number(id||0)+')">Save part</button>')}
function savePart(id){const code=document.getElementById('partCode').value.trim(),name=document.getElementById('partName').value.trim(),qty=+document.getElementById('partQty').value,min=+document.getElementById('partMin').value,price=+document.getElementById('partPrice').value;if(!code||!name||![qty,min,price].every(Number.isFinite)||qty<0||min<0||price<0)return alert('Enter valid part details.');let p=data.parts.find(x=>x.id===id);if(!p){p={id:data.parts.length+1};data.parts.push(p)}Object.assign(p,{code,name,qty,min,price});closeModal();render()}
document.getElementById('cover').onclick=e=>{if(e.target.id==='cover')closeModal()};document.onkeydown=e=>{if(e.key==='Escape')closeModal()};render();
</script></body></html>
