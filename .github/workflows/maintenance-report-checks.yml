name: Maintenance Report Form Checks
on:
  push:
    branches: [luis]
    paths:
      - 'backend/Modules/Maintenance/Maintenance.php'
      - 'public/assets/js/modules/maintenance/maintenance.js'
      - 'tests/maintenance_overview_tests.php'
      - 'backend/Modules/Maintenance/Purchasing.php'
      - 'backend/Modules/General/Analytics.php'
      - 'tests/descriptive_vehicle_status_chart.test.cjs'
      - 'public/assets/js/modules/administration/oversight.js'
      - 'backend/Modules/Administration/Oversight.php'
      - '.github/workflows/maintenance-report-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Validate backend and report regression test syntax
        run: |
          php -l backend/Modules/Maintenance/Maintenance.php
          php -l backend/Modules/Maintenance/Purchasing.php
          php -l backend/Modules/General/Analytics.php
          php -l backend/Modules/Administration/Oversight.php
          node --check public/assets/js/modules/administration/oversight.js
          php -l tests/maintenance_overview_tests.php
          node --check public/assets/js/modules/maintenance/maintenance.js
      - name: Check three vehicle types and trip status reporting contract
        run: node tests/descriptive_vehicle_status_chart.test.cjs
      - name: Check automatic server reporting date contract
        run: |
          php -r '$s=file_get_contents("backend/Modules/Maintenance/Maintenance.php"); $start=strpos($s,"private static function report("); $end=strpos($s,"private static function ",$start+10); $section=substr($s,$start,$end-$start); if(!str_contains($section,"\$date = date(") || str_contains($section,"dateField(\$d, '\''reported_on'\'')")) exit(1);'
